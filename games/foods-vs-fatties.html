<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foods vs Fatties</title>
<style>
  body{margin:0;background:#2b1d0e;font-family:system-ui,sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center;padding:8px 16px;box-sizing:border-box}
  #wrap{width:100%;max-width:1400px;position:relative} /* the game board grows to fill bigger windows */
  #bar{display:flex;gap:8px;padding:8px 0;align-items:stretch;flex-wrap:wrap}
  #crumbs{background:#f3d27a;color:#3d2a17;border-radius:8px;padding:4px 12px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:70px}
  #crumbs b{font-size:22px}
  .card{background:#6b4a2b;border:3px solid #3d2a17;border-radius:8px;padding:3px 4px;cursor:pointer;text-align:center;width:62px;box-sizing:border-box;position:relative;user-select:none;overflow:hidden}
  .card.sel{border-color:#ffd54a;box-shadow:0 0 8px #ffd54a}
  .card.off{opacity:.45}
  .card .e{font-size:24px;line-height:1.15}
  .card .c{font-size:11px;font-weight:700}
  .card .n{font-size:9px;font-weight:700;color:#ffe9c4;line-height:1.1;margin:1px auto 1px}
  .card .cd{position:absolute;left:0;top:0;right:0;background:rgba(0,0,0,.55);pointer-events:none}
  #prog{margin-left:auto;display:flex;flex-direction:column;justify-content:center;font-size:12px;min-width:140px}
  #prog .track{height:10px;background:#3d2a17;border-radius:5px;overflow:hidden;margin-top:4px}
  #prog .fill{height:100%;width:0;background:#e85d4a}
  canvas{width:100%;height:auto;display:block;border-radius:8px;cursor:pointer}
  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.6);border-radius:8px;text-align:center;padding:16px}
  #overlay h1{margin:0 0 8px;font-size:40px}
  #overlay p{max-width:520px;line-height:1.4}
  #overlay button{font-size:20px;padding:10px 28px;border-radius:10px;border:0;background:#ffd54a;color:#3d2a17;font-weight:800;cursor:pointer;margin:4px}
  #overlay .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  #overlay button.home{background:#6b4a2b;color:#fff}

  /* ---- homepage ---- */
  #home{width:100%;max-width:900px;border-radius:16px;overflow:hidden;text-align:center;
        background:linear-gradient(#3b1d12 0%,#7a3b22 100%);color:#fff;position:relative;margin-top:8px}
  #home .sun{position:absolute;top:18px;right:28px;font-size:54px;animation:spin 18s linear infinite}
  #home .title{font-family:'Lilita One',system-ui,sans-serif;margin:28px 0 0;line-height:.9;letter-spacing:1px}
  #home .title .big{display:block;font-size:clamp(48px,11vw,96px);color:#ffd54a;
        text-shadow:0 4px 0 #b4561f,0 0 0 #000,-3px -3px 0 #3d2a17,3px -3px 0 #3d2a17,-3px 3px 0 #3d2a17,3px 3px 0 #3d2a17,0 8px 0 #3d2a17}
  #home .title .big.red{color:#ff7b6b}
  #home .title .vs{display:inline-block;font-size:clamp(22px,4vw,34px);color:#fff;background:#d62828;border:3px solid #3d2a17;
        border-radius:999px;padding:2px 14px;margin:6px 0;transform:rotate(-6deg)}
  #home .tag{font-weight:800;font-size:18px;margin:14px 16px 0;color:#ffe9c4;text-shadow:0 2px 0 rgba(0,0,0,.4);letter-spacing:.5px}
  #homecv{width:100%;height:auto;display:block;cursor:default;border-radius:0}
  #home .bottom{background:#5a3b20;padding:18px 16px 22px;color:#fff}
  #play{font-family:'Lilita One',system-ui,sans-serif;font-size:34px;letter-spacing:2px;padding:10px 54px;border-radius:16px;
        border:4px solid #3d2a17;background:#ffd54a;color:#3d2a17;cursor:pointer;box-shadow:0 6px 0 #3d2a17;animation:pulse 1.4s ease-in-out infinite}
  #play:hover{background:#ffe27a}
  #play:active{transform:translateY(4px);box-shadow:0 2px 0 #3d2a17}
  #testtag{align-self:center;font-size:12px;font-weight:800;color:#3d2a17;background:#9cff9c;border-radius:999px;padding:4px 10px}
  #news{display:flex;align-items:center;gap:10px;max-width:640px;margin:18px auto 0;background:#2a1810;border:2px solid #f3d27a;border-radius:12px;padding:10px 14px;text-align:left;min-height:48px}
  #news .label{flex:none;font-size:11px;font-weight:900;letter-spacing:1px;color:#2a1810;background:#ff6b5b;border-radius:6px;padding:4px 7px;animation:blink 1.2s steps(2) infinite}
  #newstext{font-size:15px;font-weight:700;color:#ffe9c4;line-height:1.35;transition:opacity .5s}
  @keyframes blink{50%{opacity:.55}}
  #quit{align-self:center;font-size:14px;font-weight:700;padding:8px 14px;border-radius:10px;border:2px solid #3d2a17;
        background:#6b4a2b;color:#fff;cursor:pointer}
  #quit:hover{background:#80593a}
  #musicbtn{position:fixed;top:10px;right:10px;z-index:10;font-size:14px;font-weight:700;padding:6px 12px;border-radius:999px;
        border:2px solid #3d2a17;background:#ffd54a;color:#3d2a17;cursor:pointer}
  #musicmenu{position:fixed;top:46px;right:10px;z-index:11;display:none;flex-direction:column;gap:6px;min-width:200px;
        background:#5a3b20;border:3px solid #3d2a17;border-radius:12px;padding:10px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
  #musicmenu .mtitle{font-weight:800;font-size:13px;color:#f3d27a;text-align:left;padding:0 2px 2px}
  #musicmenu button{text-align:left;font-size:15px;font-weight:700;padding:8px 12px;border-radius:8px;border:0;
        background:#6b4a2b;color:#fff;cursor:pointer}
  #musicmenu button:hover{background:#80593a}
  #musicmenu button.on{background:#ffd54a;color:#3d2a17}
  /* ---- Guide Book ---- */
  #bookbtn{margin-top:14px;font-size:16px;font-weight:800;padding:8px 18px;border-radius:12px;border:3px solid #3d2a17;background:#8a5a36;color:#fff;cursor:pointer;box-shadow:0 4px 0 #3d2a17}
  #bookbtn:hover{background:#a06a42}
  #book{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);padding:16px;box-sizing:border-box}
  #book .page{width:100%;max-width:760px;max-height:100%;display:flex;flex-direction:column;background:#fdf3dc;color:#3d2a17;border:6px solid #8a5a36;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.5);overflow:hidden}
  #book .top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#8a5a36;color:#fff}
  #book .top h2{margin:0;flex:1;font-family:'Lilita One',system-ui,sans-serif;font-size:26px;letter-spacing:1px}
  #book .top button{font-size:15px;font-weight:800;border:0;border-radius:10px;padding:6px 12px;cursor:pointer;background:#fdf3dc;color:#3d2a17}
  #bookbody{overflow-y:auto;padding:16px}
  #book .choices{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;padding:20px 0}
  #book .choices button{width:200px;height:170px;font-size:64px;border:4px solid #8a5a36;border-radius:18px;background:#fff7e6;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 6px 0 #8a5a36}
  #book .choices button span{font-family:'Lilita One',system-ui,sans-serif;font-size:28px;color:#3d2a17}
  #book .choices button:hover{background:#ffeec2}
  #book .entries{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  #book .entry{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid #e3cfa5;border-radius:12px;padding:10px}
  #book .pic{flex:none;width:90px;height:90px;display:flex;align-items:center;justify-content:center;background:#f3ede2;border-radius:10px;overflow:hidden}
  #book .pic canvas{width:auto;height:90px;border-radius:0;cursor:default}
  #book .bigemoji{font-size:54px}
  #book .entry h3{margin:0 0 4px;font-size:17px}
  #book .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
  #book .chips span{font-size:12px;font-weight:700;background:#f3d27a;border-radius:999px;padding:2px 8px}
  #book .entry p{margin:0;font-size:13.5px;line-height:1.35}
  #book .entry p.bio{margin-top:6px;font-size:12.5px;font-style:italic;color:#8a5a36}
  @keyframes pulse{50%{transform:scale(1.06)}}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
</head>
<body>
<button id="musicbtn"></button>
<div id="musicmenu"></div>
<div id="home">
  <h1 class="title"><span class="big">FOODS</span><span class="vs">vs</span><span class="big red">FATTIES</span></h1>
  <p class="tag">The hungry crowd is coming for your snacks. Stop them!</p>
  <canvas id="homecv" width="900" height="320"></canvas>
  <div class="bottom">
    <button id="play">▶ PLAY</button>
    <div><button id="bookbtn">📖 Guide Book</button></div>
    <div id="news"><span class="label">📰 BREAKING NEWS</span><span id="newstext"></span></div>
  </div>
</div>
<div id="book"><div class="page">
  <div class="top"><button id="bookback">◀ Back</button><h2 id="booktitle">📖 Guide Book</h2><button id="bookclose">✖</button></div>
  <div id="bookbody"></div>
</div></div>
<div id="wrap" style="display:none">
  <div id="bar">
    <div id="crumbs"><b id="cr">100</b><span>🍫 candy bars</span></div>
    <div id="cards" style="display:flex;gap:5px;flex-wrap:wrap;flex:1 1 420px"></div>
    <button id="quit">🏠 Quit</button>
    <span id="testtag" style="display:none">🧪 TEST MODE</span>
    <div id="prog">Hungry crowd approaching<div class="track"><div class="fill" id="fill"></div></div></div>
  </div>
  <div style="position:relative">
    <canvas id="cv" width="900" height="500"></canvas>
    <div id="overlay" style="display:none"></div>
  </div>
</div>
<script>
const COLS=9, ROWS=5, CELL=100, W=COLS*CELL, H=ROWS*CELL;
const cv=document.getElementById('cv'); let ctx=cv.getContext('2d');

const FOODS={
  candy: {e:'🍫',name:'Candy Bar',     cost:50, hp:2,   cd:5,  make:15}, // gives a candy bar every 15 seconds
  pizza: {e:'🍕',name:'Pizza Shooter', cost:100,hp:4,   cd:5,  fire:1.4, dmg:1, shot:'🧀'},
  burger:{e:'🍔',name:'Burger Blocker',cost:50, hp:8,   cd:15},
  salt:  {e:'🧂',name:'Salt Shaker',   cost:125,hp:5,   cd:8,  salt:4, pellets:2, dmg:1}, // shakes every 4 seconds, throws 2 salt pellets, 1 damage each = 2 damage in all
  honey: {e:'🍯',name:'Honey Bear',    cost:150,hp:4,   cd:6,  fire:2,   dmg:1, honey:true, draw:drawHoneyBear}, // shoots honey that slows fatties down
  egg:   {e:'🥚',name:'Egg',           cost:75, hp:1,   cd:20, boom:true}, // blows up the first fatty that bites it
  butter:{e:'🧈',name:'Butter',        cost:175,hp:1,   cd:15, trap:true}, // slippery puddle: one fatty slips and slides back, then the butter is gone
  coconut:{e:'🥥',name:'Coconut Cannon',cost:200,hp:5,  cd:10, fire:4,   dmg:1, roll:true, draw:drawCoconutCannon}, // shoots a coconut that rolls through EVERY fatty in the row
  popcorn:{e:'🍿',name:'Popcorn Popper',cost:200,hp:4,  cd:8,  fire:2.5, dmg:1, shot:'🍿', spread:true}, // shoots popcorn into 3 rows: its own, the one above and the one below
  spaghetti:{e:'🍝',name:'Spaghetti Trap',cost:125,hp:6, cd:20, grab:true}, // noodles grab a fatty and swallow him up! then it's full and has to rest
  sugar:{e:'🍬',name:'Sugar Rush',cost:250,hp:1, cd:30, rush:true}, // place it anywhere: every food goes twice as fast for 10 seconds!
  beans:{e:'🥫',name:'Bean Can',cost:200,hp:2, cd:20, bean:true}, // 2 uses: each fatty who eats it gets gassy and floats away (hp = uses left)
  shovel:{e:'🥄',name:'Spoon (remove)',cost:0} // the spoon: click a food to dig it up and remove it
};
const FATTIES={
  normal:{hp:6,  speed:13, bite:1, r:30, shirt:'#4a90d9'},
  jogger:{hp:4,  speed:26, bite:0.8, r:26, shirt:'#e8a33d'},
  big:   {hp:15, speed:8,  bite:1.5, r:38, shirt:'#9b59b6'},
  foodie:{hp:6,  speed:13, bite:1, r:30, shirt:'#3fae6b'}, // eats every other shot instead of getting hurt
  menu:  {hp:8,  speed:13, bite:1, r:30, shirt:'#4a90d9', menu:2}, // normal guy holding a menu like a shield: +2 HP, the menu falls when those 2 are gone
  quake: {hp:10, speed:14, bite:1, r:33, shirt:'#a0522d', quake:true}, // Earthquake Starter: jumps over the first food, and when he lands ALL your foods stop working for 5 seconds
  fork:  {hp:4,  speed:12, bite:1, r:28, shirt:'#5f9ea0', thrower:true}, // Fork Thrower: weak, but stops and throws forks at your food from far away
  chef:  {hp:7,  speed:12, bite:1, r:31, shirt:'#f4f4f4', chef:true}, // Chef Fatty: heals the fatties near him by tossing them snacks
  buttered:{hp:6,speed:52, bite:1, r:30, shirt:'#f2c94c', buttery:true}, // Buttered Up Fatty: slides in super fast on his butt, and butter can't make him slip
  balloon:{hp:5, speed:22, bite:1, r:29, shirt:'#ff7eb6', balloon:true} // Balloon Fatty: floats over all your shots and food! only salt (from above) can pop his balloons
};

// hurt a fatty. the foodie eats every other shot (first one he eats, next one hurts, and so on)
function hitFatty(z,dmg){
  if(z.type==='foodie'){
    z.ate=!z.ate;
    if(z.ate){ float(z.x,z.row*CELL+20,'yum!','#9cff9c'); return false; }
  }
  const hadMenu=FATTIES[z.type].menu && z.hp>z.max-FATTIES[z.type].menu;
  z.hp-=dmg;
  if(hadMenu && z.hp<=z.max-FATTIES[z.type].menu && z.hp>0) float(z.x,z.row*CELL+20,'menu dropped!','#ffe9a8');
  return true;
}

const SLOW_TIME=3, SLOW_SPEED=0.6; // honey makes them move at 60% speed for 3 seconds

// when the Earthquake Starter lands: the floor shakes and ALL foods stop working for 5 seconds
// Fork Thrower settings: throws from up to 3 squares away, one fork every 2.5 seconds, each fork does 1 damage
const FORK_RANGE=3*CELL, FORK_EVERY=2.5, FORK_DAMAGE=1;
// Chef Fatty settings: every 5 seconds he heals the fatties right next to him (left, right, above, below) by 1 HP
const CHEF_EVERY=5, CHEF_RANGE=1.5*CELL, CHEF_HEAL=1; // heals every 5 seconds
// Spaghetti Trap settings: noodles wrap him for 1.5 seconds, he sinks in slowly for 6 seconds (other fatties can eat the spaghetti while it's busy!), then it rests 8 seconds
const GRAB_WRAP=1.5, GRAB_SINK=6, SPAGHETTI_REST=8;
// Sugar Rush: all your foods work twice as fast for 10 seconds
const RUSH_TIME=10, RUSH_SPEED=2;
// Bean Can: his tummy rumbles for 2 seconds, then he floats straight up and off the screen
const GAS_RUMBLE=2, GAS_FLOAT_SPEED=140;
const QUAKE_TIME=5;
function earthquake(z){
  S.quakeUntil=S.t+QUAKE_TIME; S.shake=1;
  float(z.x,z.row*CELL+10,'EARTHQUAKE!','#ff9f1c');
  sfxQuake();
}

// the honey bear bottle (drawn by hand because there's no emoji for it)
// the coconut cannon (drawn by hand): a wooden wheel, a dark barrel, and a coconut ready to go
function drawCoconutCannon(g,x,y,s){
  g.save(); g.translate(x,y); g.scale(s,s);
  g.fillStyle='#6b4428'; g.fillRect(-20,12,34,8);                                        // wooden base
  g.save(); g.rotate(-0.35);                                                             // barrel tilted up a bit
  g.fillStyle='#3a3a44'; g.beginPath(); g.roundRect(-16,-12,38,20,6); g.fill();         // barrel
  g.fillStyle='#55555f'; g.fillRect(-12,-12,6,20); g.fillRect(4,-12,6,20);              // metal bands
  g.fillStyle='#22222a'; g.beginPath(); g.ellipse(22,-2,5,10,0,0,7); g.fill();          // the opening
  g.fillStyle='#7a4a22'; g.beginPath(); g.arc(22,-2,7,0,7); g.fill();                   // coconut peeking out
  g.fillStyle='#4a2c12'; g.beginPath(); g.arc(24,-4,1.6,0,7); g.arc(20,-4,1.6,0,7); g.arc(22,0,1.6,0,7); g.fill();
  g.restore();
  g.fillStyle='#8a5a36'; g.beginPath(); g.arc(-4,16,11,0,7); g.fill();                  // big wheel
  g.strokeStyle='#4a2c17'; g.lineWidth=2.5; g.stroke();
  g.beginPath(); for(let a=0;a<4;a++){ g.moveTo(-4,16); g.lineTo(-4+Math.cos(a*Math.PI/4*2)*11,16+Math.sin(a*Math.PI/4*2)*11); } g.stroke();
  g.restore();
}
function drawHoneyBear(g,x,y,s){
  g.save(); g.translate(x,y); g.scale(s,s);
  g.fillStyle='#e8a317';                                                     // honey color
  g.beginPath(); g.ellipse(0,10,18,20,0,0,7); g.fill();                      // body
  g.beginPath(); g.arc(-11,-14,6,0,7); g.arc(11,-14,6,0,7); g.fill();        // ears
  g.beginPath(); g.arc(0,-8,13,0,7); g.fill();                               // head
  g.fillStyle='#f7c94b'; g.beginPath(); g.ellipse(0,12,10,12,0,0,7); g.fill(); // tummy shine
  g.fillStyle='#d62828'; g.fillRect(-5,-30,10,10);                           // red cap
  g.fillStyle='#222'; g.beginPath(); g.arc(-5,-10,2,0,7); g.arc(5,-10,2,0,7); g.arc(0,-4,2.5,0,7); g.fill(); // eyes + nose
  g.restore();
}
const DURATION=150; // seconds of spawning

let S; // game state
function reset(){
  S={t:0, crumbs:100, grid:[...Array(ROWS)].map(()=>Array(COLS).fill(null)),
     fatties:[], shots:[], pellets:[], booms:[], forks:[], pickups:[], floaters:[], banner:null, sel:null,
     cooldown:{}, quakeUntil:0, rushUntil:0, shake:0, nextSpawn:18, nextSky:4, bigWave:false, over:false, won:false};
}

// ---- cards ----
const cardsEl=document.getElementById('cards'); const cardEls={};
for(const k in FOODS){
  const f=FOODS[k], d=document.createElement('div');
  d.className='card'; d.innerHTML=`<div class="cd"></div><div class="e">${f.e}</div><div class="n">${f.name}</div><div class="c">${k==='shovel'?'free':f.cost}</div>`;
  d.onclick=()=>{ S.sel = S.sel===k?null:k; };
  if(f.draw){ // hand-drawn food: put a little picture on the card
    const pc=document.createElement('canvas'); pc.width=40; pc.height=40; pc.style.height='28px'; pc.style.width='28px'; pc.style.borderRadius='0';
    f.draw(pc.getContext('2d'),20,22,0.8); d.querySelector('.e').replaceChildren(pc);
  }
  cardsEl.appendChild(d); cardEls[k]=d;
}

// ---- input ----
cv.addEventListener('click',e=>{
  if(!S||S.over) return;
  const r=cv.getBoundingClientRect(), x=(e.clientX-r.left)*W/r.width, y=(e.clientY-r.top)*H/r.height;
  // collect crumbs first
  for(const p of S.pickups){ if(Math.hypot(p.x-x,p.y-y)<35){ p.dead=true; const v=p.crumb?25:50; /* crumbs give 25, candy bars give 50 */ S.crumbs+=v; float(p.x,p.y,'+'+v); return; } }
  const c=Math.floor(x/CELL), row=Math.floor(y/CELL);
  if(S.sel==='shovel'){ if(S.grid[row][c]){ S.grid[row][c]=null; float(c*CELL+50,row*CELL+40,'dug up!','#fff'); } S.sel=null; return; }
  if(S.sel==='shovel'){ S.grid[row][c]=null; S.sel=null; return; }
  const f=FOODS[S.sel];
  if((S.grid[row][c] && !f.rush)||S.crumbs<f.cost||(S.cooldown[S.sel]||0)>0) return;
  S.crumbs-=f.cost; S.cooldown[S.sel]=f.cd;
  if(f.rush){ // SUGAR RUSH! the candy gets eaten right away and every food goes faster for 10 seconds
    S.rushUntil=S.t+RUSH_TIME; S.booms.push({x:c*CELL+50,y:row*CELL+50,life:0.6});
    float(c*CELL+50,row*CELL+30,'SUGAR RUSH!','#ff69b4'); sfxRush(); S.sel=null; return;
  }
  S.grid[row][c]={type:S.sel, hp:f.hp, max:f.hp, timer:f.make||0.5};
  S.sel=null;
});

function float(x,y,txt,color='#fff8c4'){ S.floaters.push({x,y,txt,color,life:1}); }
// show a BIG message in the middle of the screen for a few seconds
const BANNER_TIME=3;
function banner(txt,color){ S.banner={txt,color,life:BANNER_TIME}; }

function spawn(type,row){
  const F=FATTIES[type];
  S.fatties.push({type,row:row??Math.floor(Math.random()*ROWS),x:W+40+Math.random()*40,hp:F.hp,max:F.hp,eating:false,wob:Math.random()*6,drool:(S.spawnCount=(S.spawnCount||0)+1)%6===0,droolPhase:Math.random(),floating:!!F.balloon}); // every 6th fatty drools
}

// ---- update ----
function update(dt){
  S.t+=dt;
  for(const k in S.cooldown) S.cooldown[k]=Math.max(0,S.cooldown[k]-dt);

  // spawning
  if(S.t<DURATION && S.t>=S.nextSpawn){
    const p=S.t/DURATION, roll=Math.random();
    // first part: only normal guys. then joggers join. then big guys join too.
    let type='normal';
    // joggers start at about 1 minute, foodies at about 1 minute 20, big guys at about 1 minute 40
    const JOGGERS_AT=0.4, FOODIE_AT=0.53, BIG_AT=0.65, QUAKE_AT=0.72, FORK_AT=0.46, CHEF_AT=0.8, BUTTER_AT=0.58, BALLOON_AT=0.68; // balloon fatties at about 1 minute 42, fork throwers at about 1 minute 9, buttered up fatties at about 1 minute 27, earthquake starters at about 1 minute 48, chefs at about 2 minutes (they're really good, so they come late)
    if(p>=BIG_AT){ type = roll<0.2?'big' : roll<0.45?'jogger' : roll<0.65?'foodie' : 'normal'; }
    else if(p>=FOODIE_AT){ type = roll<0.35?'jogger' : roll<0.6?'foodie' : 'normal'; }
    else if(p>=JOGGERS_AT){ type = roll<0.4?'jogger' : 'normal'; }
    // menu guys start at about 40 seconds. some of the normal guys show up holding a menu
    const MENU_AT=0.27;
    if(type==='normal' && p>=MENU_AT && Math.random()<0.35) type='menu';
    if(p>=MENU_AT && !S.saidMenu){ type='menu'; S.saidMenu=true; }
    if(p>=JOGGERS_AT && !S.saidJogger) type='jogger'; // first jogger always shows up on time
    if(p>=FOODIE_AT && !S.saidFoodie) type='foodie';  // first foodie always shows up on time
    if(p>=BIG_AT && !S.saidBig) type='big';            // first big guy always shows up on time
    if(p>=QUAKE_AT && Math.random()<0.13) type='quake';       // earthquake starters show up late
    if(p>=FORK_AT && type==='normal' && Math.random()<0.3) type='fork';  // fork throwers show up after the joggers
    if(p>=FORK_AT && !S.saidFork){ type='fork'; S.saidFork=true; }        // first one always shows up on time
    if(p>=CHEF_AT && type==='normal' && Math.random()<0.25) type='chef';  // chef fatties show up late, after the earthquake starters
    if(p>=CHEF_AT && !S.saidChef){ type='chef'; S.saidChef=true; }        // first one always shows up on time
    if(p>=BUTTER_AT && type==='normal' && Math.random()<0.25) type='buttered'; // buttered up fatties show up after the foodies
    if(p>=BUTTER_AT && !S.saidButtered){ type='buttered'; S.saidButtered=true; }  // first one always shows up on time
    if(p>=BALLOON_AT && type==='normal' && Math.random()<0.25) type='balloon'; // balloon fatties show up after the big fatties
    if(p>=BALLOON_AT && !S.saidBalloon){ type='balloon'; S.saidBalloon=true; }    // first one always shows up on time
    if(p>=QUAKE_AT && !S.saidQuake){ type='quake'; S.saidQuake=true; } // first one always shows up on time
    if(type==='jogger' && !S.saidJogger){ S.saidJogger=true; }
    if(type==='foodie' && !S.saidFoodie){ S.saidFoodie=true; }
    if(type==='big' && !S.saidBig){ S.saidBig=true; banner('The big fatties are coming!','#d7a6ff'); sfxAnnounce(true); }
    spawn(type);
    S.nextSpawn=S.t+Math.max(2.2,11-S.t/14);
  }
  if(!S.bigWave && S.t>=DURATION-12){
    S.bigWave=true; banner('A HUGE HUNGRY CROWD!','#ff7b6b'); sfxAnnounce(true);
    for(let i=0;i<10;i++) spawn(['normal','big','jogger','foodie','menu','quake','fork','chef','buttered','balloon'][i%10]);
  }

  // sky crumbs
  if(S.t>=S.nextSky){
    S.pickups.push({x:60+Math.random()*(W-120),y:-20,ty:60+Math.random()*(H-120),life:10, crumb:true}); // only crumbs fall from the sky
    S.nextSky=S.t+10+Math.random()*4; // crumbs fall every 10-14 seconds
  }
  for(const p of S.pickups){
    if(p.vy!==undefined){ // candy bar jumping out of the plant
      p.vy+=600*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
      if(p.vy>0 && p.y>=p.ty){ p.y=p.ty; delete p.vy; }
    } else if(p.y<p.ty) p.y+=60*dt;
    p.life-=dt; if(p.life<=0) p.dead=true;
  }

  // foods act
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const fd=S.grid[r][c]; if(!fd) continue;
    const F=FOODS[fd.type], cx=c*CELL+50, cy=r*CELL+50;
    if(fd.hp<=0){ S.grid[r][c]=null; float(cx,cy,'nom!','#ff9f9f'); continue; }
    if(fd.restT>0) fd.restT-=dt; // spaghetti trap resting after a big meal
    if(S.quakeUntil>S.t) continue; // earthquake! the foods are too dizzy to do anything
    fd.timer-=dt*(S.rushUntil>S.t?RUSH_SPEED:1); // sugar rush makes every food work twice as fast
    if(F.make && fd.timer<=0){ fd.timer=F.make; S.pickups.push({x:cx,y:cy,vx:(Math.random()<.5?-1:1)*(30+Math.random()*30),vy:-260,ty:cy+30,life:12}); float(cx,cy-30,'pop!'); }
    if(F.fire && fd.timer<=0){
      // which rows does this food shoot into? popcorn: its own row AND the rows above and below
      const rows=F.spread?[r-1,r,r+1].filter(rr=>rr>=0&&rr<ROWS):[r];
      if(S.fatties.some(z=>rows.includes(z.row) && z.x>cx && z.x<W+20)){
        for(const rr of rows)
          S.shots.push({x:cx+25,y:cy+(F.roll?18:0),ty:F.spread?rr*CELL+50:undefined,row:rr,dmg:F.dmg,splash:F.splash||0,e:F.shot,honey:F.honey,roll:F.roll,hit:[]});
        if(F.spread) sfxPop();
        fd.timer=F.fire;
      }
    }
    // salt shaker: shake first, then throw pellets up in the air at the fatties in its row
    if(F.salt && fd.timer<=0 && !fd.shake){
      if(S.fatties.some(z=>z.row===r && z.x>cx && z.x<W+20)){ fd.shake=0.6; fd.timer=F.salt; }
    }
    if(fd.shake>0){
      fd.shake-=dt;
      if(fd.shake<=0){
        fd.shake=0;
        const targets=S.fatties.filter(z=>z.row===r && z.x>cx && z.x<W+20).sort((a,b)=>a.x-b.x);
        for(let i=0;i<F.pellets && targets.length;i++){
          S.pellets.push({sx:cx+(i-1)*8, sy:cy-25, z:targets[i%targets.length], t:-i*0.12, dur:0.8, dmg:F.dmg});
        }
      }
    }
  }

  // salt pellets flying in an arc
  for(const p of S.pellets){
    p.t+=dt;
    if(p.t>=p.dur){ p.dead=true; if(S.fatties.includes(p.z)){ if(p.z.floating){ p.z.floating=false; float(p.z.x,p.z.row*CELL-10,'POP!','#ff5a5a'); sfxPop(); } else hitFatty(p.z,p.dmg); } } // salt comes from above, so it can pop balloons
  }
  S.pellets=S.pellets.filter(p=>!p.dead);

  // shots
  for(const s of S.shots){
    if(s.roll){ // coconut: rolls along the ground and BONKS every fatty it rolls into (each one only once)
      s.x+=240*dt;
      if(s.x>W+40){ s.dead=true; continue; }
      for(const z of S.fatties){
        if(z.row===s.row && !z.floating && !s.hit.includes(z) && Math.abs(z.x-s.x)<FATTIES[z.type].r){
          s.hit.push(z); hitFatty(z,s.dmg); float(z.x,z.row*CELL+15,'BONK!','#e9c49a'); sfxBonk();
        }
      }
      continue;
    }
    s.x+=320*dt;
    if(s.ty!==undefined) s.y+=(s.ty-s.y)*Math.min(1,dt*8); // popcorn flying up or down into its row
    if(s.x>W+40){ s.dead=true; continue; }
    const hit=S.fatties.find(z=>z.row===s.row && !z.floating && Math.abs(z.x-s.x)<FATTIES[z.type].r); // shots fly right under a floating balloon fatty
    if(hit){
      s.dead=true;
      if(s.splash) S.fatties.forEach(z=>{ if(z.row===s.row && Math.abs(z.x-hit.x)<s.splash) hitFatty(z,s.dmg); });
      else if(hitFatty(hit,s.dmg) && s.honey){ if(!(hit.slowUntil>S.t)) float(hit.x,hit.row*CELL+20,'sticky!','#ffd166'); hit.slowUntil=S.t+SLOW_TIME; }
    }
  }

  // fatties
  for(const z of S.fatties){
    // right before the very first fatty walks onto the screen: "Fatties are coming!"
    if(!S.saidFatties && z.x<=W+55){ S.saidFatties=true; banner('Fatties are coming!','#ff9f9f'); sfxAnnounce(); }
    const F=FATTIES[z.type];
    if(z.hp<=0){ z.dead=true; float(z.x,z.row*CELL+30,'full!','#b9ffb0'); continue; }
    // ate from the Bean Can: rumble rumble... PFFFT! then he floats straight up and off the screen
    if(z.gassy){
      const g=z.gassy; g.t+=dt;
      if(g.t>GAS_RUMBLE){
        if(!g.tooted){ g.tooted=true; float(z.x,z.row*CELL+20,'PFFFT!','#c9a0ff'); sfxToot(); }
        z.jumpH=(g.t-GAS_RUMBLE)*GAS_FLOAT_SPEED;
        if(z.jumpH>z.row*CELL+200) z.dead=true; // gone off the top of the screen
      }
      continue;
    }
    // caught in a Spaghetti Trap: the noodles wrap around him, then he sinks in and he's gone
    if(z.grabbed){
      const g=z.grabbed, trap=S.grid[g.row][g.c];
      if(!trap || !FOODS[trap.type].grab){ z.grabbed=null; z.jumpH=0; continue; } // spaghetti got eaten or dug up: he's free!
      g.t+=dt;
      if(g.t>GRAB_WRAP) z.jumpH=-(g.t-GRAB_WRAP)/GRAB_SINK*FATTIES[z.type].r*2.6;   // sinking down
      if(g.t>=GRAB_WRAP+GRAB_SINK){ z.dead=true; trap.busy=false; trap.restT=SPAGHETTI_REST; float(g.c*CELL+50,g.row*CELL+20,'SLUUURP!','#f3d36b'); sfxSlurp(); }
      continue;
    }
    // Balloon Fatty: floats over everything (no eating, no butter) until salt pops his balloons
    if(z.floating){
      z.x-=F.speed*dt; z.wob+=dt*3; z.jumpH=70+Math.sin(z.wob)*6;
      if(z.x<-10){ S.over=true; S.won=false; }
      continue;
    }
    if(z.jumpH>0 && !z.jump){ z.jumpH=Math.max(0,z.jumpH-260*dt); continue; } // falling down after his balloons pop
    // Fork Thrower: if there's food in his row close enough, he stops and throws forks at it
    if(F.thrower){
      let tc=-1;
      for(let cc=COLS-1;cc>=0;cc--){ const f2=S.grid[z.row][cc]; if(f2 && !FOODS[f2.type].trap && cc*CELL+50<z.x){ tc=cc; break; } }
      if(tc>=0 && z.x-(tc*CELL+50)<=FORK_RANGE){
        z.throwing=true; z.throwT=(z.throwT??0.8)-dt; z.wob+=dt*2;
        if(z.throwT<=0){ z.throwT=FORK_EVERY; S.forks.push({x:z.x-30,y:z.row*CELL+38,row:z.row,c:tc}); }
        continue;
      }
      z.throwing=false;
    }
    // Earthquake Starter flying through the air
    if(z.jump){
      z.jump.t+=dt; const u=Math.min(1,z.jump.t/z.jump.dur);
      z.x=z.jump.from+(z.jump.to-z.jump.from)*u; z.jumpH=Math.sin(u*Math.PI)*110;
      if(u>=1){ z.jump=null; z.jumpH=0; earthquake(z); }
      continue;
    }
    // sliding backward on butter
    if(z.slide>0){
      const d=Math.min(z.slide,330*dt); z.x=Math.min(W+20,z.x+d); z.slide-=d; z.wob+=dt*25;
      continue;
    }
    // stepping on butter: WHOA! slip and slide back (big fatties are heavy, so they only slide 1 tile)
    const bc=Math.floor(z.x/CELL), bf=(bc>=0&&bc<COLS)?S.grid[z.row][bc]:null;
    if(bf && FOODS[bf.type].trap && !F.buttery){ // the Buttered Up Fatty is already buttery, so butter doesn't make him slip
      z.slide=(z.type==='big'?1:2)*CELL;
      float(z.x,z.row*CELL+20,'Whoa!','#ffe066'); sfxSlip();
      bf.hp-=1;
      if(bf.hp<=0){ S.grid[z.row][bc]=null; float(bc*CELL+50,z.row*CELL+60,'all used up!','#fff'); }
      continue;
    }
    const c=Math.floor((z.x-F.r)/CELL);
    const fd=(c>=0&&c<COLS)?S.grid[z.row][c]:null;
    z.eating = !!fd && fd.hp>0 && !FOODS[fd.type].trap; // nobody eats the butter, they slip on it
    if(z.eating && FOODS[fd.type].bean){ // BEAN CAN: he eats some beans... uh oh
      fd.hp-=1; if(fd.hp<=0){ S.grid[z.row][c]=null; float(c*CELL+50,z.row*CELL+60,'all gone!','#fff'); }
      z.gassy={t:0}; z.eating=false; float(z.x,z.row*CELL+10,'uh oh...','#c9a0ff'); sfxRumble();
      continue;
    }
    if(z.eating && FOODS[fd.type].grab && !(fd.restT>0) && !fd.busy){ // SPAGHETTI TRAP: the noodles grab him!
      z.grabbed={t:0,row:z.row,c}; fd.busy=true; z.eating=false;
      float(z.x,z.row*CELL+10,'GRABBED!','#f3d36b');
      continue;
    }
    if(F.quake && !z.jumped && z.eating){ // Earthquake Starter: instead of eating, he JUMPS over the food!
      z.jumped=true; z.eating=false; z.jump={t:0,dur:1,from:z.x,to:c*CELL-F.r-6};
      float(z.x,z.row*CELL+10,'HUP!','#ffd23f');
      continue;
    }
    if(z.eating && FOODS[fd.type].boom){ // he bit the egg: BOOM! the egg and the fatty are both gone
      const ex=c*CELL+50, ey=z.row*CELL+50;
      S.grid[z.row][c]=null; z.hp=0; z.dead=true;
      S.booms.push({x:ex,y:ey,life:0.6}); float(ex,ey-20,'SPLAT!','#fff27a'); sfxSplat();
      continue;
    }
    const slow=z.slowUntil>S.t?SLOW_SPEED:1; // honey makes them slower at walking and eating
    if(z.eating) fd.hp-=F.bite*slow*dt; else z.x-=F.speed*slow*dt;
    z.wob-=dt*(1-slow)*5;
    z.wob+=dt*(z.eating?14:5);
    if(z.x<-10){ S.over=true; S.won=false; }
  }

  // Chef Fatty: every few seconds he tosses snacks to the fatties near him and heals them
  for(const ch of S.fatties){
    if(!FATTIES[ch.type].chef || ch.dead || ch.hp<=0) continue;
    ch.healT=(ch.healT??CHEF_EVERY)-dt;
    if(ch.healT>0) continue;
    ch.healT=CHEF_EVERY;
    let healed=0;
    for(const z of S.fatties){
      if(z===ch || z.dead || z.hp<=0 || z.hp>=z.max || z.fullyHealed) continue; // once a fatty is healed back to full, the chef can't heal him again
      // only fatties right next to him: 1 square to his left or right, or right above or below him
      const dx=Math.abs(z.x-ch.x), nextTo=(z.row===ch.row && dx<=CELL*1.2) || (Math.abs(z.row-ch.row)===1 && dx<=CELL*0.6);
      if(nextTo){ z.hp=Math.min(z.max,z.hp+CHEF_HEAL); if(z.hp>=z.max) z.fullyHealed=true; float(z.x,z.row*CELL+10,'+'+CHEF_HEAL+' 🍪','#7dff8a'); healed++; }
    }
    if(healed) float(ch.x,ch.row*CELL+5,'snack time!','#fff');
  }

  S.shots=S.shots.filter(s=>!s.dead);
  S.fatties=S.fatties.filter(z=>!z.dead);
  S.pickups=S.pickups.filter(p=>!p.dead);
  if(S.shake>0) S.shake=Math.max(0,S.shake-dt*0.8);
  // forks: fly left and poke the food they were thrown at
  for(const k of S.forks){
    k.x-=300*dt;
    if(k.x<=k.c*CELL+60){
      k.dead=true;
      const target=S.grid[k.row][k.c];
      if(target && !FOODS[target.type].trap){ target.hp-=FORK_DAMAGE; float(k.c*CELL+50,k.row*CELL+20,'poke!','#e0e0e0'); }
    }
  }
  S.forks=S.forks.filter(k=>!k.dead);
  for(const b of S.booms) b.life-=dt;
  S.booms=S.booms.filter(b=>b.life>0);
  for(const f of S.floaters){ f.y-=30*dt; f.life-=dt*0.8; }
  S.floaters=S.floaters.filter(f=>f.life>0);
  if(S.banner){ S.banner.life-=dt; if(S.banner.life<=0) S.banner=null; }

  if(S.t>DURATION && S.fatties.length===0){ S.over=true; S.won=true; }
}

// ---- draw ----
const FATTY_SIZE=1; // how big fatties look (1 = normal size)
function drawFatty(z){
  // when honey hits him, he turns honey yellow for 3 seconds
  const sticky=z.slowUntil>S.t;
  const skin=sticky?'#f6cf57':'#f1c27d', pants=sticky?'#b8860b':'#3b3b5c';
  const F=FATTIES[z.type], x=z.x, y=z.row*CELL+58-(z.jumpH||0), r=F.r, bob=Math.sin(z.wob)*3;
  ctx.save(); ctx.translate(x,y+bob); ctx.scale(FATTY_SIZE,FATTY_SIZE); // fatties are drawn a bit bigger so they're easy to see
  if(z.slide>0) ctx.rotate(-0.35+Math.sin(z.wob)*0.15); // leaning back and flailing while sliding
  if(z.gassy){ // bean can: his tummy puffs up and he shakes... then floats away
    const u=Math.min(1,z.gassy.t/GAS_RUMBLE); ctx.scale(1+0.25*u,1+0.25*u);
    if(z.gassy.t<GAS_RUMBLE) ctx.translate(Math.sin(S.t*60)*2.5,0);
  }
  if(F.buttery && !z.eating && !(z.slide>0)) ctx.rotate(-0.42); // Buttered Up Fatty leans way back, sliding on his butt
  // shadow
  ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(0,r+4-bob,r*0.9,7,0,0,7); ctx.fill();
  // legs
  ctx.fillStyle=pants; ctx.fillRect(-r*0.5,r*0.6,r*0.35,r*0.5); ctx.fillRect(r*0.15,r*0.6,r*0.35,r*0.5);
  // body
  ctx.fillStyle=sticky?'#e8a317':F.shirt; ctx.beginPath(); ctx.ellipse(0,r*0.15,r,r*0.85,0,0,7); ctx.fill();
  // arm reaching forward
  ctx.strokeStyle=skin; ctx.lineWidth=8; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-r*0.6,0); ctx.lineTo(-r*1.15,z.eating?-6+Math.sin(z.wob*2)*6:-4); ctx.stroke();
  // head
  ctx.fillStyle=skin; ctx.beginPath(); ctx.arc(-4,-r*0.85,r*0.55,0,7); ctx.fill();
  // eyes
  ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(-14,-r*0.95,3,0,7); ctx.arc(-1,-r*0.95,3,0,7); ctx.fill();
  // mouth
  const open=z.eating?Math.abs(Math.sin(z.wob))*7+2:2;
  ctx.fillStyle='#7a1f1f'; ctx.beginPath(); ctx.ellipse(-10,-r*0.68,6,open,0,0,7); ctx.fill();
  if(z.drool){ // some fatties drool: a little drip grows from the corner of the mouth, then falls
    const u=((performance.now()/1000)*0.7+z.droolPhase)%1;
    ctx.fillStyle='#9fdcff'; ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=1.5;
    if(u<0.75){ const len=5+u*28; ctx.beginPath(); ctx.ellipse(-15,-r*0.62+len/2,3.5,len/2,0,0,7); ctx.fill(); ctx.beginPath(); ctx.arc(-15,-r*0.62+len,5.5,0,7); ctx.fill(); ctx.stroke(); }
    else { const fall=(u-0.75)*4; ctx.globalAlpha=1-fall; ctx.beginPath(); ctx.arc(-15,-r*0.62+26+fall*45,5,0,7); ctx.fill(); ctx.globalAlpha=1; }
  }
  if(z.type==='foodie'){
    // white napkin tucked in his shirt
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(-r*0.55,-r*0.35); ctx.lineTo(r*0.25,-r*0.35); ctx.lineTo(-r*0.15,r*0.35); ctx.closePath(); ctx.fill();
    // 😋 means he will eat the next shot
    if(!z.ate){ ctx.font='18px serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('😋',r*0.7,-r*1.1); }
  }
  if(z.floating){ // Balloon Fatty: 3 balloons on strings tied to his hand
    const tie=[-r*1.1,-r*0.2], balloons=[[-r*0.9,-r*2.55,'#ff5a5a'],[-4,-r*2.85,'#ffd23f'],[r*0.75,-r*2.5,'#5aa9ff']];
    ctx.strokeStyle='#555'; ctx.lineWidth=1.2;
    for(const [bx,by,col] of balloons){
      ctx.beginPath(); ctx.moveTo(tie[0],tie[1]); ctx.quadraticCurveTo((tie[0]+bx)/2+4,(tie[1]+by)/2,bx,by+13); ctx.stroke();
      ctx.fillStyle=col; ctx.beginPath(); ctx.ellipse(bx,by,11,13,0,0,7); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.55)'; ctx.beginPath(); ctx.ellipse(bx-4,by-4,3,4,0,0,7); ctx.fill();
    }
  }
  if(F.buttery){ // Buttered Up Fatty: shiny and greasy, with a pat of butter on his head
    ctx.fillStyle='rgba(255,255,255,.75)';
    ctx.beginPath(); ctx.ellipse(-r*0.35,-r*0.15,r*0.18,r*0.4,0.4,0,7); ctx.fill();          // shine on his belly
    ctx.beginPath(); ctx.ellipse(-12,-r*1.1,4,7,0.5,0,7); ctx.fill();                         // shine on his head
    ctx.fillStyle='#ffe066'; ctx.strokeStyle='#e0b83a'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(-4-9,-r*1.42-6,18,9,2); ctx.fill(); ctx.stroke();          // butter pat on his head
    ctx.fillStyle='rgba(255,224,102,.85)'; ctx.beginPath(); ctx.ellipse(6,r*0.95,4,6,0,0,7); ctx.fill(); // butter drip
  }
  if(F.chef){ // Chef Fatty: a tall white chef hat and two little buttons on his coat
    ctx.fillStyle='#fff'; ctx.strokeStyle='#ccc'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.roundRect(-4-r*0.42,-r*1.55,r*0.84,r*0.5,4); ctx.fill(); ctx.stroke();

  }
  if(F.thrower){ // Fork Thrower: a fork in his hand (held up high when he's about to throw)

    ctx.fillStyle='#ff9f1c'; ctx.beginPath(); ctx.arc(-4,-r*1.02,r*0.52,Math.PI,0); ctx.fill(); ctx.fillRect(-4-r*0.7,-r*1.05,r*1.4,5);
  }
  if(F.menu && z.hp>z.max-F.menu){ // holding up his menu like a shield
    ctx.save(); ctx.translate(-r*1.05,-r*0.35); ctx.rotate(-0.12);
    ctx.fillStyle='#8b1e1e'; ctx.strokeStyle='#f3d27a'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(-15,-22,30,40,3); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#f3d27a'; ctx.font='bold 9px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('MENU',0,-12);
    ctx.fillStyle='rgba(243,210,122,.6)'; for(const ly of [-2,4,10]) ctx.fillRect(-9,ly,18,2); // little food lines
    ctx.restore();
  }
  if(z.slowUntil>S.t){ // honey dripping on him when he's slowed
    ctx.fillStyle='rgba(232,163,23,.85)';
    ctx.beginPath(); ctx.ellipse(0,-r*1.3,r*0.5,6,0,0,7); ctx.fill();
    for(const dx of [-10,4,14]){ ctx.beginPath(); ctx.ellipse(dx,-r*1.15+Math.abs(dx)*0.3,3,7,0,0,7); ctx.fill(); }
  }
  ctx.restore();
  if(F.buttery && !z.eating && !(z.slide>0)){ // speed lines behind him while he slides
    ctx.strokeStyle='rgba(255,224,102,.8)'; ctx.lineWidth=3; ctx.lineCap='round';
    for(const [dy,len] of [[-6,26],[8,34],[22,22]]){ const off=(performance.now()/40)%10; ctx.beginPath(); ctx.moveTo(x+r+6+off,y+dy); ctx.lineTo(x+r+6+off+len,y+dy); ctx.stroke(); }
  }
  if(z.gassy && z.gassy.t>GAS_RUMBLE){ // gas clouds puffing out under him as he floats up
    ctx.save(); ctx.font='22px serif'; ctx.globalAlpha=0.8;
    for(let k=0;k<3;k++){ const ph=(S.t*2+k/3)%1; ctx.fillText('💨',x-10+k*10,y+r+10+ph*30); }
    ctx.restore();
  }
  if(z.noHp) return; // no HP number on the homepage
  // HP number above his head
  ctx.font='bold 16px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const hpTxt='❤️ '+Math.ceil(z.hp), ty=Math.max(12,y+bob-r*1.75*FATTY_SIZE-(F.chef?22:0)-(z.floating?62:0)); // chefs have a tall hat, so their HP sits higher
  ctx.fillStyle='#000a'; ctx.beginPath(); ctx.roundRect(x-26,ty-11,52,22,11); ctx.fill();
  ctx.fillStyle='#fff'; ctx.fillText(hpTxt,x,ty+1);
  if(F.chef){ // chef's countdown to his next snack time, next to his HP
    const secs=Math.max(1,Math.ceil(z.healT??CHEF_EVERY));
    ctx.fillStyle='#000a'; ctx.beginPath(); ctx.roundRect(x+28,ty-11,42,22,11); ctx.fill();
    ctx.fillStyle='#ffd23f'; ctx.font='bold 15px system-ui'; ctx.fillText('⏱'+secs,x+49,ty+1);
  }
  if(F.buttery && !z.eating && !(z.slide>0)){ // speech bubble while he slides
    const say="I'm buttered up!", by=Math.max(14,ty-30);
    ctx.font='bold 15px system-ui'; const w=ctx.measureText(say).width+18;
    ctx.fillStyle='#fff'; ctx.strokeStyle='#3d2a17'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.roundRect(x-w/2,by-13,w,26,12); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-6,by+12); ctx.lineTo(x,by+22); ctx.lineTo(x+6,by+12); ctx.fill();
    ctx.fillStyle='#3d2a17'; ctx.fillText(say,x,by+1);
  }
}

function draw(){
  // earthquake: shake the whole floor
  cv.style.transform=S.shake>0?`translate(${(Math.random()-.5)*16*S.shake}px,${(Math.random()-.5)*16*S.shake}px)`:"";
  // diner floor: each square is one tile, black and white like a checkerboard

  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    ctx.fillStyle=(r+c)%2?'#3b3b44':'#f3ede2'; ctx.fillRect(c*CELL,r*CELL,CELL,CELL);
  }
  // shiny floor: a soft light reflection
  const shine=ctx.createLinearGradient(0,0,W,H);
  shine.addColorStop(0,'rgba(255,255,255,.12)'); shine.addColorStop(0.5,'rgba(255,255,255,0)'); shine.addColorStop(1,'rgba(255,220,180,.08)');
  ctx.fillStyle=shine; ctx.fillRect(0,0,W,H);
  // red lines between the big squares, so you can see where to place food
  ctx.strokeStyle='rgba(200,60,50,.55)'; ctx.lineWidth=2;
  for(let c=1;c<COLS;c++){ ctx.beginPath(); ctx.moveTo(c*CELL,0); ctx.lineTo(c*CELL,H); ctx.stroke(); }
  for(let r=1;r<ROWS;r++){ ctx.beginPath(); ctx.moveTo(0,r*CELL); ctx.lineTo(W,r*CELL); ctx.stroke(); }
  // the kitchen counter on the left (what the fatties are trying to reach)
  ctx.fillStyle='#b5482f'; ctx.fillRect(0,0,10,H);
  ctx.fillStyle='#c9ccd2'; ctx.fillRect(10,0,3,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';

  // hover highlight
  if(S.sel && hover){ ctx.fillStyle='rgba(255,213,74,.4)'; ctx.fillRect(hover.c*CELL,hover.r*CELL,CELL,CELL); }

  // foods
  ctx.font='56px serif'; // food size on the board
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const fd=S.grid[r][c]; if(!fd) continue;
    const cx=c*CELL+50, cy=r*CELL+50;
    const squish=1+Math.sin(S.t*3+c+r)*0.04;
    if(S.rushUntil>S.t && !FOODS[fd.type].trap){ // sugar rush: a pink, sparkly glow behind every food
      const pulse=0.5+0.5*Math.sin(S.t*12+c+r);
      ctx.fillStyle='rgba(255,105,180,'+(0.25+0.25*pulse)+')'; ctx.beginPath(); ctx.arc(cx,cy,38+pulse*6,0,7); ctx.fill();
      ctx.save(); ctx.font='14px serif'; ctx.fillText('✨',cx+Math.cos(S.t*6+c)*30,cy-30+Math.sin(S.t*6+r)*6); ctx.restore();
    }
    if(!FOODS[fd.type].trap){ ctx.fillStyle='rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(cx,cy+24,30,9,0,0,7); ctx.fill(); ctx.fillStyle='#000'; } // shadow so food stands out on the tiles
    if(FOODS[fd.type].trap){ // butter: a shiny, slippery puddle on the grass with the butter in the middle
      ctx.fillStyle='rgba(255,224,102,.85)'; ctx.beginPath(); ctx.ellipse(cx,cy+18,44,18,0,0,7); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.6)'; ctx.beginPath(); ctx.ellipse(cx-14,cy+13,12,4,-0.2,0,7); ctx.fill();
      ctx.save(); ctx.font='40px serif'; ctx.fillText('🧈',cx,cy+8); ctx.restore();
    } else {
      ctx.save(); ctx.translate(cx,cy); if(fd.shake>0) ctx.rotate(Math.sin(S.t*50)*0.35); ctx.scale(squish,2-squish);
      if(FOODS[fd.type].draw) FOODS[fd.type].draw(ctx,0,0,1.25); else ctx.fillText(FOODS[fd.type].e,0,0);
      ctx.restore();
    }
    // HP number under the food (for butter: how many slips are left)
    ctx.save(); ctx.font='bold 14px system-ui';
    ctx.fillStyle='#000a'; ctx.beginPath(); ctx.roundRect(cx-22,cy+30,44,18,9); ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillText((FOODS[fd.type].trap||FOODS[fd.type].bean)?'✖ '+Math.ceil(fd.hp):'💚 '+Math.ceil(fd.hp),cx,cy+40); ctx.restore();
    if(FOODS[fd.type].grab && fd.restT>0){ // spaghetti is full and resting: show how long until it can grab again
      ctx.save(); ctx.font='bold 14px system-ui'; ctx.fillStyle='#000a'; ctx.beginPath(); ctx.roundRect(cx-26,cy-46,52,20,10); ctx.fill();
      ctx.fillStyle='#ffd23f'; ctx.fillText('😋 '+Math.ceil(fd.restT),cx,cy-36); ctx.restore();
    }
    if(S.quakeUntil>S.t){ // dizzy stars spinning over every food during an earthquake
      ctx.save(); ctx.font='18px serif';
      for(let k=0;k<2;k++){ const a=S.t*5+k*Math.PI; ctx.fillText('💫',cx+Math.cos(a)*18,cy-36+Math.sin(a)*5); }
      ctx.restore();
    }
  }

  // fatties sorted by row so lower rows overlap
  [...S.fatties].sort((a,b)=>a.row-b.row).forEach(z=>{
    if(!z.grabbed){ drawFatty(z); return; }
    // a fatty caught in the spaghetti: he sinks down into the noodles (only the part above the plate shows)
    const groundY=z.row*CELL+82, g=z.grabbed, u=Math.min(1,g.t/GRAB_WRAP);
    ctx.save(); ctx.beginPath(); ctx.rect(z.x-90,0,180,groundY); ctx.clip(); drawFatty(z); ctx.restore();
    // noodles wrapping around him, waving
    ctx.save(); ctx.strokeStyle='#f3d36b'; ctx.lineWidth=5; ctx.lineCap='round';
    const tall=(FATTIES[z.type].r*2.2)*u;
    for(let k=0;k<6;k++){
      const bx=z.x-25+k*10, wv=Math.sin(S.t*8+k)*10;
      ctx.beginPath(); ctx.moveTo(bx,groundY); ctx.bezierCurveTo(bx+wv,groundY-tall*0.4,bx-wv,groundY-tall*0.8,bx+wv*0.5,groundY-tall); ctx.stroke();
    }
    ctx.restore();
  });

  // shots
  ctx.font='26px serif';
  for(const s of S.shots){
    if(s.honey){ // a gooey honey blob
      ctx.fillStyle='#e8a317'; ctx.beginPath(); ctx.ellipse(s.x,s.y,11,9,0,0,7); ctx.fill();
      ctx.fillStyle='#ffe08a'; ctx.beginPath(); ctx.arc(s.x+3,s.y-3,3,0,7); ctx.fill();
    } else if(s.roll){ // a coconut spinning as it rolls
      ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(s.x/14); ctx.font='34px serif'; ctx.fillText('🥥',0,0); ctx.restore();
    } else ctx.fillText(s.e,s.x,s.y);
  }

  // forks flying and spinning toward your food
  ctx.save(); ctx.font='26px serif';
  for(const k of S.forks){ ctx.save(); ctx.translate(k.x,k.y); ctx.rotate(-k.x/18); ctx.fillText('🍴',0,0); ctx.restore(); }
  ctx.restore();

  // salt pellets: little white grains that fly up high and come down on a fatty
  for(const p of S.pellets){
    if(p.t<0) continue;
    const u=Math.min(1,p.t/p.dur), ex=p.z.x, ey=p.z.row*CELL+30;
    const px=p.sx+(ex-p.sx)*u, py=p.sy+(ey-p.sy)*u - 160*4*u*(1-u);
    ctx.fillStyle='#fff'; ctx.strokeStyle='#888'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(px,py,5,0,7); ctx.fill(); ctx.stroke();
  }

  // pickups
  for(const p of S.pickups){
    ctx.globalAlpha=p.life<2?(Math.sin(p.life*20)>0?1:0.3):1;
    ctx.fillStyle='rgba(255,230,140,.5)'; ctx.beginPath(); ctx.arc(p.x,p.y,24+Math.sin(S.t*6)*4,0,7); ctx.fill();
    ctx.font=p.crumb?'24px serif':'34px serif'; ctx.fillText(p.crumb?'🥐':'🍫',p.x,p.y);
    ctx.globalAlpha=1;
  }

  // egg explosions: a big yellow and white splat that grows and fades
  for(const b of S.booms){
    const u=1-b.life/0.6;
    ctx.globalAlpha=1-u;
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(b.x,b.y,25+u*55,0,7); ctx.fill();
    ctx.fillStyle='#ffcc1a'; ctx.beginPath(); ctx.arc(b.x,b.y,12+u*30,0,7); ctx.fill();
    ctx.globalAlpha=1;
  }

  // sugar rush countdown at the top
  if(S.rushUntil>S.t){
    ctx.save(); ctx.font='bold 26px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    const ry=S.quakeUntil>S.t?74:29, txt='🍬 SUGAR RUSH! '+Math.ceil(S.rushUntil-S.t);
    ctx.fillStyle='rgba(0,0,0,.6)'; ctx.beginPath(); ctx.roundRect(W/2-170,ry-21,340,40,20); ctx.fill();
    ctx.fillStyle='hsl('+((S.t*200)%360)+',100%,70%)'; ctx.fillText(txt,W/2,ry); ctx.restore();
  }
  // earthquake countdown at the top
  if(S.quakeUntil>S.t){
    ctx.save(); ctx.font='bold 26px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    const txt='💫 Your food is dizzy! '+Math.ceil(S.quakeUntil-S.t);
    ctx.fillStyle='rgba(0,0,0,.6)'; ctx.beginPath(); ctx.roundRect(W/2-190,8,380,40,20); ctx.fill();
    ctx.fillStyle='#ffd23f'; ctx.fillText(txt,W/2,29); ctx.restore();
  }
  // BIG message in the middle of the screen (like "Fatties are coming!")
  if(S.banner){
    const b=S.banner, age=BANNER_TIME-b.life;
    const pop=age<0.25?0.6+0.4*Math.sin(age/0.25*Math.PI/2)*1.1:1;  // pops in
    const fade=b.life<0.5?b.life/0.5:1;                               // fades out at the end
    ctx.save(); ctx.globalAlpha=fade;
    ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(0,H/2-55,W,110);    // dark stripe across the middle
    ctx.translate(W/2,H/2); ctx.scale(pop,pop); ctx.rotate(Math.sin(age*8)*0.02);
    ctx.font='bold 58px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    const tw=ctx.measureText(b.txt).width; if(tw>W-60) ctx.scale((W-60)/tw,(W-60)/tw); // shrink long messages so they fit
    ctx.lineWidth=10; ctx.strokeStyle='#3d2a17'; ctx.lineJoin='round'; ctx.strokeText(b.txt,0,0);
    ctx.fillStyle=b.color; ctx.fillText(b.txt,0,0);
    ctx.restore();
  }

  // floaters
  ctx.font='bold 22px system-ui';
  for(const f of S.floaters){ ctx.globalAlpha=Math.max(0,f.life); ctx.fillStyle='#000'; ctx.fillText(f.txt,f.x+2,f.y+2); ctx.fillStyle=f.color; ctx.fillText(f.txt,f.x,f.y); }
  ctx.globalAlpha=1;
}

function updateHUD(){
  document.getElementById('cr').textContent=S.crumbs;
  document.getElementById('fill').style.width=Math.min(100,S.t/DURATION*100)+'%';
  for(const k in FOODS){
    const f=FOODS[k], el=cardEls[k], cd=S.cooldown[k]||0;
    el.classList.toggle('sel',S.sel===k);
    el.classList.toggle('off',k!=='shovel'&&(S.crumbs<f.cost||cd>0));
    el.querySelector('.cd').style.height=(f.cd?cd/f.cd*100:0)+'%';
  }
}

      running=false;
      const btns='<div class="btns"><button id="start">'+(S.won?'Play again':'Try again')+'</button><button id="gohome" class="home">🏠 Home</button></div>';

}

function tone(freq,t,dur,type,vol){
  const ac=Music.ac, o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(Music.master); o.start(t); o.stop(t+dur+0.02);
}
let noiseBuf=null;
function noise(t,dur,vol,filterType,freq){
  const ac=Music.ac;
  if(!noiseBuf){ noiseBuf=ac.createBuffer(1,ac.sampleRate*0.5,ac.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
  s.buffer=noiseBuf; f.type=filterType; f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(Music.master); s.start(t); s.stop(t+dur+0.02);
}
function kick(t){
  const ac=Music.ac, o=ac.createOscillator(), g=ac.createGain();
  o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(40,t+0.15);
  g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
  o.connect(g); g.connect(Music.master); o.start(t); o.stop(t+0.22);
}
// --- instruments that sound more like real ones ---
// plucked string, like a ukulele or guitar: a buzzy sound that gets softer and darker fast
function pluck(freq,t,dur,vol){
  const ac=Music.ac, o=ac.createOscillator(), f=ac.createBiquadFilter(), g=ac.createGain();
  o.type='sawtooth'; o.frequency.value=freq;
  f.type='lowpass'; f.Q.value=1; f.frequency.setValueAtTime(freq*6,t); f.frequency.exponentialRampToValueAtTime(freq*1.2,t+dur*0.6);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.005); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(f); f.connect(g); g.connect(Music.master); o.start(t); o.stop(t+dur+0.02);
}
// marimba: a soft wooden "bonk" with a quick little ring on top
function marimba(freq,t,vol){
  const ac=Music.ac;
  for(const [mult,v,d] of [[1,vol,0.6],[4,vol*0.35,0.08],[10,vol*0.1,0.03]]){
    const o=ac.createOscillator(), g=ac.createGain();
    o.type='sine'; o.frequency.value=freq*mult;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.004); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(Music.master); o.start(t); o.stop(t+d+0.02);
  }
}
// soft whistle / flute: fades in gently and wiggles a little (vibrato), no hard "bonk"
function whistle(freq,t,dur,vol){
  const ac=Music.ac, o=ac.createOscillator(), lfo=ac.createOscillator(), lfoGain=ac.createGain(), g=ac.createGain();
  o.type='sine'; o.frequency.value=freq;
  lfo.frequency.value=5.5; lfoGain.gain.value=freq*0.008; lfo.connect(lfoGain); lfoGain.connect(o.frequency);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.05);
  g.gain.setValueAtTime(vol,t+dur*0.6); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(Music.master); o.start(t); lfo.start(t); o.stop(t+dur+0.02); lfo.stop(t+dur+0.02);
}
// banjo: a bright, twangy pluck that dies away really fast
function banjo(freq,t,vol){
  const ac=Music.ac, o=ac.createOscillator(), hp=ac.createBiquadFilter(), peak=ac.createBiquadFilter(), g=ac.createGain();
  o.type='square'; o.frequency.setValueAtTime(freq*1.01,t); o.frequency.exponentialRampToValueAtTime(freq,t+0.03); // tiny "twang"
  hp.type='highpass'; hp.frequency.value=300;
  peak.type='peaking'; peak.frequency.value=2500; peak.Q.value=2; peak.gain.value=8;  // the bright banjo "ring"
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.003); g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
  o.connect(hp); hp.connect(peak); peak.connect(g); g.connect(Music.master); o.start(t); o.stop(t+0.25);
}
// trumpet: a brassy sound that "blooms" brighter as each note starts, with a little wobble
function trumpet(freq,t,dur,vol){
  const ac=Music.ac, o=ac.createOscillator(), f=ac.createBiquadFilter(), g=ac.createGain();
  const lfo=ac.createOscillator(), lfoGain=ac.createGain();
  o.type='sawtooth';
  o.frequency.setValueAtTime(freq*0.97,t); o.frequency.exponentialRampToValueAtTime(freq,t+0.04); // little scoop up into the note
  lfo.frequency.value=5; lfoGain.gain.value=freq*0.006; lfo.connect(lfoGain); lfoGain.connect(o.frequency);
  f.type='lowpass'; f.Q.value=2; f.frequency.setValueAtTime(freq*1.5,t); f.frequency.exponentialRampToValueAtTime(freq*5,t+0.06);
  f.frequency.exponentialRampToValueAtTime(freq*3,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.04);
  g.gain.setValueAtTime(vol*0.8,t+dur*0.7); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(f); f.connect(g); g.connect(Music.master); o.start(t); lfo.start(t); o.stop(t+dur+0.02); lfo.stop(t+dur+0.02);
}
// round, plucky bass like a big upright bass
function bassPluck(freq,t,dur,vol){
  tone(freq,t,dur,'sine',vol);
  pluck(freq,t,dur*0.7,vol*0.35);
}

// tom drum: a deep "doom" that drops in pitch
function tom(freq,t){
  const ac=Music.ac, o=ac.createOscillator(), g=ac.createGain();
  o.frequency.setValueAtTime(freq,t); o.frequency.exponentialRampToValueAtTime(freq*0.6,t+0.2);
  g.gain.setValueAtTime(0.6,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);
  o.connect(g); g.connect(Music.master); o.start(t); o.stop(t+0.27);
}
function playStep(step,t){
  const song=SONGS[Music.song], MELODY=song.melody, CHORDS=song.chords;
  const s=step%16, bar=Math.floor(step/16)%8, chord=bar%4, root=song.roots[chord];
  const sixteenth=60/song.bpm/4;
  if(song.bigDrums){
    // BIG drums for Fatties Are Coming
    if(bar===0 && s===0) noise(t,1.2,0.25,'highpass',5000);                 // crash cymbal at the start
    if(s===0||s===3||s===8||s===10||(bar%2===1&&s===6)) kick(t);            // lots of kicks
    if(s===4||s===12){ noise(t,0.16,0.45,'bandpass',1800); tone(190,t,0.08,'triangle',0.3); } // loud snare
    if(s===7&&bar%2===0) noise(t,0.06,0.12,'bandpass',1800);               // little "ghost" snare
    noise(t,s===14?0.18:0.03,s%2===0?0.1:0.05,'highpass',8000);              // hi-hat on every step
    if(bar%4===3 && s>=12) tom(220-(s-12)*35,t);                             // drum fill at the end of each part
  } else {
    // drums: soft kick, a clap, and a shaker
    if(s===0||s===8) kick(t);
    if(s===4||s===12){ noise(t,0.09,0.22,'bandpass',1200); noise(t+0.012,0.07,0.16,'bandpass',1500); } // clap
    if(s%4===2) noise(t,0.05,0.06,'bandpass',6000);  // shaker (only on the off-beats now, calmer)
  }
  // bass
  const bass=song.bass;
  if(s in bass) bassPluck(midi(root-12+bass[s]),t,sixteenth*2.2,0.55);
  // strummed ukulele chords on the off-beats
  if(s===4||s===12||s===14&&chord===3) CHORDS[chord].forEach((n,i)=>pluck(midi(n),t+i*0.012,0.28,0.06));
  // a little banjo picking in the second half of every other bar
  if(song.banjo && bar%2===1 && s>=8 && s%2===0){
    const notes=CHORDS[chord].map(n=>n+12), roll=[0,1,2,1];
    banjo(midi(notes[roll[(s-8)/2]]),t,0.05);
  }
  // melody on a soft whistle (it lasts until the next note starts)
  const m=MELODY[step%MELODY.length];
  if(m>0){
    let len=1; while(len<song.longest && MELODY[(step+len)%MELODY.length]===_) len++;
    // whistle plays the tune. in Honey Bear Dance the trumpet takes over for the second half
    if(song.lead==='trumpet') trumpet(midi(m),t,sixteenth*len*0.85,0.1);
    else if(bar<4 || !song.trumpet) whistle(midi(m),t,sixteenth*len*0.95,0.2);
    else trumpet(midi(m),t,sixteenth*len*0.9,0.09);
  }
}
function musicTick(){
  const sixteenth=60/SONGS[Music.song].bpm/4;
  while(Music.next<Music.ac.currentTime+0.15){ playStep(Music.step,Music.next); Music.next+=sixteenth; Music.step++; }
}
// set up sound (music and sound effects have their own volume, so turning music off keeps the sound effects)
function ensureAudio(){
  if(Music.ac) return;
  Music.ac=new (window.AudioContext||window.webkitAudioContext)();
  Music.master=Music.ac.createGain(); Music.master.gain.value=0.22; Music.master.connect(Music.ac.destination);
  Music.sfx=Music.ac.createGain(); Music.sfx.gain.value=0.3; Music.sfx.connect(Music.ac.destination);
}
// play sound effects using the same instruments, but through the sound-effects volume
function playSfx(fn){
  try{
    ensureAudio(); Music.ac.resume();
    const m=Music.master; Music.master=Music.sfx;
    try{ fn(Music.ac.currentTime+0.01); } finally { Music.master=m; }
  }catch(e){}
}

// timpani: a huge, deep orchestra drum that rings for a while
function timpani(freq,t,dur,vol){
  const ac=Music.ac, o=ac.createOscillator(), g=ac.createGain();
  o.frequency.setValueAtTime(freq*1.15,t); o.frequency.exponentialRampToValueAtTime(freq,t+0.05);

  o.connect(g); g.connect(Music.master); o.start(t); o.stop(t+dur+0.02);

}
// a brass chord that starts quiet and slowly gets louder and brighter (builds up tension)
function brassSwell(notes,t,dur,vol){
  const ac=Music.ac;
  for(const n of notes){
    const o=ac.createOscillator(), f=ac.createBiquadFilter(), g=ac.createGain();
    o.type='sawtooth'; o.frequency.value=midi(n); o.detune.value=(Math.random()-0.5)*12;
    f.type='lowpass'; f.frequency.setValueAtTime(200,t); f.frequency.exponentialRampToValueAtTime(2500,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+dur); g.gain.linearRampToValueAtTime(0,t+dur+0.05);
    o.connect(f); f.connect(g); g.connect(Music.master); o.start(t); o.stop(t+dur+0.1);
  }
}
// a "whoosh" that rises up
function whoosh(t,dur,vol){
  const ac=Music.ac;
  if(!noiseBuf) noise(t,0.001,0.0001,'lowpass',100);
  const s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
  s.buffer=noiseBuf; s.loop=true; f.type='bandpass'; f.Q.value=3;
  f.frequency.setValueAtTime(300,t); f.frequency.exponentialRampToValueAtTime(4000,t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+dur); g.gain.linearRampToValueAtTime(0,t+dur+0.05);
  s.connect(f); f.connect(g); g.connect(Music.master); s.start(t); s.stop(t+dur+0.1);
}
// "___ are coming!": a dark sound that builds up bigger and bigger... then one huge hit that rings out. oh no!

  ctx.fillStyle='#f3d27a'; ctx.beginPath(); ctx.arc(806+80*(1-doorOpen*0.8)-10,170,4,0,7); ctx.fill();
  // the table with a checkered tablecloth
  ctx.fillStyle='#5a3b20'; ctx.fillRect(250,232,10,40); ctx.fillRect(440,232,10,40);
  for(let i=0;i<10;i++){ ctx.fillStyle=i%2?'#fff':'#e04848'; ctx.fillRect(235+i*23,215,23,22); }

  // --- the story ---
  home.timer+=dt;
  const lead=Math.min(...home.fatties.map(z=>z.x))*HK;
  if(home.state==='calm' && lead<560){ home.state='run'; home.timer=0; }
  if(home.state==='run' && home.fatties.every(z=>z.x*HK<-80)){ home.state='wait'; home.timer=0; }
  if(home.state==='wait' && home.timer>1.2) homeReset();

  // fatties walk in (and run when chasing)
  const chase=home.state==='run';
  for(const z of home.fatties){
    z.x-=FATTIES[z.type].speed*(chase?5:3.5)*dt; z.wob+=dt*(chase?12:5);
  }
  ctx.save(); ctx.scale(HK,HK);
  [...home.fatties].sort((a,b)=>b.x-a.x).forEach(drawFatty);
  ctx.restore();
  if(chase){ ctx.font='bold 26px system-ui'; ctx.fillStyle='#d62828'; for(const z of home.fatties) ctx.fillText('!',z.x*HK-6,(FATTIES[z.type].r>34?122:140)+Math.sin(homeTime*20+z.x)*3); }

  // the food on the table: happy and bouncing... then RUNNING AWAY
  for(const f of home.foods){
    f.pop=Math.max(0,f.pop-dt);
    let x=f.x, y=f.y, s=1-f.pop/0.4;                                   // pops in when it comes back
    if(home.state==='run'){
      f.x-=230*dt; x=f.x; y=f.y-Math.abs(Math.sin(homeTime*14+f.hop))*22;  // hop hop hop, run!
      ctx.font='bold 18px system-ui'; ctx.fillStyle='#fff';
      ctx.fillText(home.timer<1?'AAH!':'',x,y-38);
      ctx.fillStyle='#7ad3ff'; ctx.beginPath(); ctx.arc(x+18,y-18,3,0,7); ctx.fill(); // sweat drop
    } else y=f.y-Math.abs(Math.sin(homeTime*3+f.hop))*6;
    ctx.save(); ctx.translate(x,y); ctx.scale(s,s); ctx.font='44px serif'; ctx.fillText(f.e,0,0); ctx.restore();
  }

  // warm light on everything
  const vig=ctx.createRadialGradient(HW/2,HH/2,HH*0.4,HW/2,HH/2,HW*0.65);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(40,10,0,.35)');
  ctx.fillStyle=vig; ctx.fillRect(0,0,HW,HH);
  ctx=saved;
}

// draw a fatty onto a little picture, using the game's own drawing code
function fattyPicture(type){
  const tall=type==='balloon'||type==='chef';            // balloons and chef hats need more room on top
  const c=document.createElement('canvas'); c.width=100; c.height=tall?135:100;
  const z={type,row:0.5,x:62,hp:FATTIES[type].hp,max:FATTIES[type].hp,wob:0,noHp:true,floating:type==='balloon'};
  const saved=ctx; ctx=c.getContext('2d'); ctx.translate(-12,tall?-13:-48); try{ drawFatty(z); }catch(e){} ctx=saved; // zoom in on him
  return c;
}
function foodPicture(key){
  const f=FOODS[key];
  if(f.draw){ const c=document.createElement('canvas'); c.width=90; c.height=90; f.draw(c.getContext('2d'),45,52,1.15); return c; }
  const s=document.createElement('div'); s.className='bigemoji'; s.textContent=f.e; return s;
}

// how fast each fatty is, in words
function speedWords(sp){
  if(sp<10) return '🐢 Slow';
  if(sp<16) return '🚶 Normal speed';
  if(sp<25) return '🏃 Fast';
  if(sp<40) return '💨 Very fast';
  return '⚡ SUPER fast!';
}
function bookEntry(pic,name,chips,text,bio){
  const d=document.createElement('div'); d.className='entry';
  const p=document.createElement('div'); p.className='pic'; p.appendChild(pic);
  const info=document.createElement('div');
  info.innerHTML='<h3></h3><div class="chips"></div><p></p><p class="bio"></p>';
  info.querySelector('h3').textContent=name;
  for(const c of chips){ const s=document.createElement('span'); s.textContent=c; info.querySelector('.chips').appendChild(s); }
  info.querySelector('p').textContent=text;
  info.querySelector('.bio').textContent=bio?'💭 '+bio:'';
  d.append(p,info); return d;
}
function showBookMenu(){
  bookTitle.textContent='📖 Guide Book'; bookBack.style.display='none';
  bookBody.innerHTML='<div class="choices"><button id="pickfoods">🍕<span>Foods</span></button><button id="pickfatties">😋<span>Fatties</span></button></div>';
  document.getElementById('pickfoods').onclick=showFoodsPage;

}
function showFoodsPage(){
  bookTitle.textContent='🍕 Foods'; bookBack.style.display='';
  bookBody.innerHTML=''; const list=document.createElement('div'); list.className='entries';
  for(const k in FOODS){
    const f=FOODS[k], chips=k==='shovel'?['💰 free']:['💰 '+f.cost];
    if(f.hp && !f.rush && !f.trap && !f.bean && k!=='shovel') chips.push('💚 '+f.hp+' HP');
    list.appendChild(bookEntry(foodPicture(k),f.name,chips,FOOD_INFO[k]||'',FOOD_BIO[k]));
  }
  bookBody.appendChild(list); bookBody.scrollTop=0;
}
function showFattiesPage(){

}
