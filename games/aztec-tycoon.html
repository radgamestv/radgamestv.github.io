    text: 'At night the farms stop and everyone goes home. Every few minutes something happens, like a famine or a festival. Good luck!' },
];
let tutStep = -1;   // -1 means the tutorial is closed

function startTutorial() {
  stopPlacing();
  tutStep = 0;
  document.getElementById('tutBlock').style.display = 'block';
  document.getElementById('tutBox').style.display = 'flex';
  showTutorialStep();
}
function showTutorialStep() {
  const step = TUTORIAL[tutStep];
  document.getElementById('tutGlyph').src = glyph(step.icon) || '';
  document.getElementById('tutTitle').textContent = step.title;
  document.getElementById('tutText').textContent = step.text;
  document.getElementById('tutStep').textContent = `${tutStep + 1} of ${TUTORIAL.length}`;
  document.getElementById('tutNext').textContent = tutStep === TUTORIAL.length - 1 ? "Let's play!" : 'Next';
  document.getElementById('tutSkip').style.display = tutStep === TUTORIAL.length - 1 ? 'none' : '';
  const target = step.target && document.querySelector(step.target);
  if (target) target.scrollIntoView({ block: 'nearest' });
  setTimeout(placeTutorial, 60);   // wait a moment for scrolling to finish
}
function placeTutorial() {
  if (tutStep < 0) return;
  const step = TUTORIAL[tutStep], hole = document.getElementById('tutHole'), box = document.getElementById('tutBox');
  const target = step.target && document.querySelector(step.target);
  const bw = box.offsetWidth, bh = box.offsetHeight, vw = innerWidth, vh = innerHeight;
  if (!target) {
    hole.style.display = 'none';
    document.getElementById('tutBlock').style.background = 'rgba(10, 8, 6, .62)';
    box.style.left = (vw - bw) / 2 + 'px'; box.style.top = (vh - bh) / 2 + 'px';
    return;
  }
  document.getElementById('tutBlock').style.background = 'none';
  const r = target.getBoundingClientRect(), pad = 6;
  const top = Math.max(4, r.top - pad), bottom = Math.min(vh - 4, r.bottom + pad);
  Object.assign(hole.style, { display: 'block', left: (r.left - pad) + 'px', top: top + 'px', width: (r.width + pad * 2) + 'px', height: (bottom - top) + 'px' });
  // put the note below the spotlight if there's room, otherwise above it, otherwise inside it
  let y = bottom + 12;
  if (y + bh > vh - 8) y = top - bh - 12;
  if (y < 8) y = Math.min(vh - bh - 8, Math.max(8, (top + bottom) / 2 - bh / 2));
  const x = Math.min(vw - bw - 8, Math.max(8, r.left + r.width / 2 - bw / 2));
  box.style.left = x + 'px'; box.style.top = y + 'px';
}
function endTutorial() {
  tutStep = -1;
  for (const id of ['tutBlock', 'tutHole', 'tutBox']) document.getElementById(id).style.display = 'none';
  game.tutorialDone = true;
  save();
}
document.getElementById('tutNext').onclick = () => {
  if (tutStep >= TUTORIAL.length - 1) endTutorial(); else { tutStep++; showTutorialStep(); }
};
document.getElementById('tutSkip').onclick = endTutorial;
document.getElementById('helpBtn').onclick = startTutorial;
window.addEventListener('resize', placeTutorial);

/* ---------- MUSIC ----------
   Background music made from code (no sound files needed!) using
   sounds like real Aztec instruments:
     huehuetl   = a big upright drum
     teponaztli = a hollow log drum that plays two notes
     ayoyotl    = rattles made of seeds and shells
     tlapitzalli = a clay flute
     atecocolli = a conch shell trumpet
   Songs:
     "The Day of an Aztec" has a day part, a quiet night part,
       and war drums when a raid is coming.
     "The Aztecs Attack" is a fast battle song.
     "Market Day" is a happy, simple song.
   It makes up new flute tunes as it goes, so it's never exactly the same. */
const MUSIC_VOLUME = 0.35;
const SCALE = [0, 3, 5, 7, 10, 12, 15, 17, 19, 22, 24];   // a five-note (pentatonic) scale, two octaves
const ROOT = 62;   // D

function makeMusic(ac, out) {
  const midiHz = m => 440 * Math.pow(2, (m - 69) / 12);
  const master = ac.createGain(); master.gain.value = MUSIC_VOLUME;
  const comp = ac.createDynamicsCompressor(); master.connect(comp); comp.connect(out);
  // a little echo, like playing in a stone plaza
  const len = Math.floor(ac.sampleRate * 2.2), echo = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) { const d = echo.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
  const reverb = ac.createConvolver(); reverb.buffer = echo;
  const wet = ac.createGain(); wet.gain.value = 0.3; reverb.connect(wet); wet.connect(master);
  const bus = ac.createGain(); bus.connect(master); bus.connect(reverb);
  const noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  { const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }

  const env = (g, t, vol, attack, decay) => {
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
  };
  const tone = (t, type, freq, vol, attack, decay, endFreq) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t + decay * 0.7);
    env(g, t, vol, attack, decay); o.connect(g); g.connect(bus); o.start(t); o.stop(t + attack + decay + 0.05);
  };
  const hiss = (t, type, freq, q, vol, decay) => {
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noise; f.type = type; f.frequency.value = freq; f.Q.value = q;
    env(g, t, vol, 0.003, decay); src.connect(f); f.connect(g); g.connect(bus);
    src.start(t, Math.random() * 0.5); src.stop(t + decay + 0.05);
  };

  const smallDrum = (t, vol) => { tone(t, 'sine', 210, vol, 0.003, 0.28, 120); hiss(t, 'bandpass', 900, 1.2, vol * 0.4, 0.06); };   // tlapanhuehuetl
  const huehuetl = (t, vol) => { tone(t, 'sine', 115, vol, 0.004, 0.75, 46); hiss(t, 'lowpass', 500, 1, vol * 0.35, 0.09); };
  const teponaztli = (t, high, vol) => {
    const f = high ? midiHz(ROOT + 7) : midiHz(ROOT);
    tone(t, 'triangle', f, vol, 0.002, 0.22); tone(t, 'sine', f * 2.76, vol * 0.25, 0.002, 0.07);
    hiss(t, 'bandpass', f * 3, 3, vol * 0.25, 0.03);
  };
  const rattle = (t, vol, length = 0.07) => hiss(t, 'highpass', 6500, 0.7, vol, length);
  const flute = (t, midi, dur, vol) => {
    const f = midiHz(midi), o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain();
    const lfo = ac.createOscillator(), depth = ac.createGain();
    o.type = 'triangle'; o2.type = 'sine';
    o.frequency.setValueAtTime(f * 0.97, t); o.frequency.exponentialRampToValueAtTime(f, t + 0.07);   // a little scoop up into the note
    o2.frequency.setValueAtTime(f * 2, t);
    lfo.frequency.value = 5.3; depth.gain.setValueAtTime(0, t); depth.gain.linearRampToValueAtTime(f * 0.012, t + Math.min(0.4, dur * 0.6));  // vibrato
    lfo.connect(depth); depth.connect(o.frequency);
    const g2 = ac.createGain(); g2.gain.value = 0.18; o2.connect(g2); g2.connect(g); o.connect(g); g.connect(bus);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.06);
    g.gain.setValueAtTime(vol, t + Math.max(0.07, dur - 0.12)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.12);
    for (const x of [o, o2, lfo]) { x.start(t); x.stop(t + dur + 0.2); }
    // breath noise
    const src = ac.createBufferSource(), bf = ac.createBiquadFilter(), bg = ac.createGain();
    src.buffer = noise; bf.type = 'bandpass'; bf.frequency.value = f * 2; bf.Q.value = 1.5;
    bg.gain.setValueAtTime(0.0001, t); bg.gain.exponentialRampToValueAtTime(vol * 0.35, t + 0.04); bg.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.1);
    src.connect(bf); bf.connect(bg); bg.connect(bus); src.start(t); src.stop(t + dur + 0.15);
  };
  const conch = (t, midi, dur, vol) => {
    const f = midiHz(midi), lp = ac.createBiquadFilter(), g = ac.createGain();
    lp.type = 'lowpass'; lp.frequency.value = 850; lp.Q.value = 2; lp.connect(g); g.connect(bus);
    for (const detune of [0, 8]) {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.detune.value = detune;
      o.frequency.setValueAtTime(f * 0.94, t); o.frequency.linearRampToValueAtTime(f, t + 0.3);
      o.frequency.setValueAtTime(f, t + dur * 0.75); o.frequency.exponentialRampToValueAtTime(f * 0.8, t + dur);   // falls at the end
      o.connect(lp); o.start(t); o.stop(t + dur + 0.1);
    }
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.35);
    g.gain.setValueAtTime(vol, t + dur * 0.75); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  };
  const drone = (t, midi, dur, vol) => {
    for (const [m, type, v] of [[midi, 'sine', 1], [midi + 7, 'triangle', 0.35]]) {
      const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = midiHz(m);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol * v, t + dur * 0.4); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(bus); o.start(t); o.stop(t + dur + 0.05);
    }
  };

  /* flute tunes: make up a short tune, then repeat it with small changes */
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const newMotif = (low) => {
    const notes = [], base = low ? 0 : 3;
    let step = base + Math.floor(Math.random() * 3), beats = 0;
    while (beats < 14) {
      const len = pick([2, 2, 2, 4, 4, 6, 3, 1]);
      if (Math.random() < 0.15 && beats > 0) notes.push({ rest: true, len });
      else notes.push({ step, len });
      beats += len;
      step = Math.max(0, Math.min(SCALE.length - 1, step + pick([-2, -1, -1, 1, 1, 2, 0, 3])));
    }
    notes.push({ step: pick([base, base + 2, base + 3]), len: 6 });   // end on a strong note
    return notes;
  };
  const vary = (motif) => motif.map(n => n.rest || Math.random() > 0.25 ? n : { ...n, step: Math.max(0, Math.min(SCALE.length - 1, n.step + pick([-1, 1]))) });

  const music = { song: 'day', mode: 'day', bar: 0, nextBar: ac.currentTime + 0.15, motif: null, phrase: 0 };
  const TEMPO = { day: 84, night: 62, war: 112, battle: 128, happy: 100 };
  const sixteenth = mode => 60 / TEMPO[mode] / 4;

  /* THE AZTECS ATTACK: a fast battle song.
     It goes: drums build up (4 bars), flute riff + conch (8 bars),
     a quiet drum breakdown (4 bars), then everything at once (8 bars). Then it starts over. */
  const riffs = [
    [0, 0, 3, 0, 5, 3, 0, 7],      // flute riffs, as steps in the scale (8 sixteenth-notes each)
    [7, 5, 7, 8, 7, 5, 3, 5],
    [3, 5, 7, 5, 3, 0, 1, 0],
  ];
  function battleBar(t, bar) {
    const s16 = sixteenth('battle'), part = bar % 24, r = Math.random;
    const section = part < 4 ? 'build' : part < 12 ? 'riff' : part < 16 ? 'break' : 'full';
    const lastBar = part === 3 || part === 11 || part === 15 || part === 23;
    for (let i = 0; i < 16; i++) {
      const tt = t + i * s16;
      // big drum: pounding beats with a kick before beat 3
      if (section !== 'break' || i === 0) {
        if (i % 4 === 0) huehuetl(tt, i === 0 ? 1 : 0.8);
        if (i === 7 || (section === 'full' && i === 15)) huehuetl(tt, 0.55);
      } else if (i === 8) huehuetl(tt, 0.5);
      // log drum racing along
      if (section === 'build') { if (i % 2 === 0 || part >= 2) teponaztli(tt, i % 4 === 2, (part + 1) * 0.06); }
      else if (section !== 'break') teponaztli(tt, [2, 3, 6, 10, 11, 14].includes(i), i % 2 ? 0.16 : 0.28);
      // rattles: every sixteenth, accents on the off-beats
      rattle(tt, section === 'break' ? 0.06 : i % 4 === 2 ? 0.17 : 0.07, 0.05);
      // drum fill at the end of each section
      if (lastBar && i >= 8) smallDrum(tt, 0.3 + (i - 8) * 0.06);
    }
    // a low pulse underneath
    if (section !== 'build') for (const i of [0, 3, 6, 8, 11, 14]) tone(t + i * s16, 'triangle', midiHz(ROOT - 24 + (part % 4 === 3 && i > 8 ? 1 : 0)), 0.12, 0.004, s16 * 2.2);
    // conch battle calls
    if (part === 4 || part === 16) conch(t, ROOT - 12, s16 * 14, 0.24);
    if (part === 20) conch(t, ROOT - 5, s16 * 14, 0.22);
    // flute riffs
    if (section === 'riff' || section === 'full') {
      const riff = riffs[Math.floor(part / 2) % riffs.length];
      riff.forEach((step, k) => { if (r() > 0.08) flute(t + k * 2 * s16, ROOT + SCALE[step], s16 * 1.7, 0.21); });
      if (section === 'full' && part % 2 === 1) flute(t + 8 * s16, ROOT + 12 + SCALE[pick([3, 5, 7])], s16 * 7.5, 0.17);
    }
  }

  function playTune(t, mode, s16, low, vol) {
    let notes = music.motif;
    if (music.phrase % 4 === 1 || music.phrase % 4 === 3) notes = vary(notes);
    let at = t;
    for (const n of notes) {
      if (!n.rest) flute(at, ROOT + SCALE[n.step] - (low ? 12 : 0), n.len * s16 * 0.95, vol);
      at += n.len * s16;
    }
  }

  /* MARKET DAY: a happy, simple song with a catchy flute tune.
     Each tune line is a list of [step in the happy scale, length in sixteenth-notes]. */
  const HAPPY_SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];   // a bright, major five-note scale
  const tunes = {
    A: [[0, 2], [1, 2], [2, 2], [3, 4], [2, 2], [1, 2], [0, 2]],
    B: [[3, 2], [4, 2], [5, 4], [4, 2], [3, 2], [2, 4]],
    C: [[2, 2], [3, 2], [4, 2], [3, 2], [2, 2], [1, 2], [2, 4]],
    D: [[1, 2], [2, 2], [1, 2], [0, 4], [0, 6]],
  };
  const tuneOrder = ['A', 'B', 'A', 'D', 'C', 'B', 'A', 'D'];
  const happyChords = [0, 5, 0, 7];   // bass notes: D, G, D, A
  function happyBar(t, bar) {
    const s16 = sixteenth('happy'), part = bar % 12, r = Math.random;
    // bouncy drums
    huehuetl(t, 0.5); huehuetl(t + 8 * s16, 0.38);
    for (const [i, high] of [[0, 0], [4, 1], [6, 0], [10, 1], [12, 0], [14, 1]]) teponaztli(t + i * s16, high, 0.22);
    for (let i = 0; i < 16; i++) rattle(t + i * s16, i % 4 === 2 ? 0.1 : 0.03, 0.05);
    // bouncing bass
    const chord = happyChords[bar % 4];
    for (const [i, up] of [[0, 0], [4, 7], [8, 0], [12, 7]]) tone(t + i * s16, 'triangle', midiHz(ROOT - 24 + chord + up), 0.16, 0.005, s16 * 3);
    // the flute tune plays for 8 bars, then 4 bars of just the beat
    if (part < 8) {
      let at = t;
      for (const [step, len] of tunes[tuneOrder[part]]) {
        const fancy = bar >= 12 && r() < 0.12 ? 1 : 0;   // after the first time, sometimes add a little extra note
        flute(at, ROOT + HAPPY_SCALE[step + fancy], len * s16 * 0.9, 0.2);
        at += len * s16;
      }
    } else if (part === 9 || part === 11) {
      // a little whistle answer in the quiet part
      flute(t + 8 * s16, ROOT + 12 + HAPPY_SCALE[pick([0, 2, 3])], s16 * 2, 0.1);
      flute(t + 10 * s16, ROOT + 12 + HAPPY_SCALE[pick([1, 2, 4])], s16 * 4, 0.1);
    }
  }

  function scheduleBar(t, mode) {
    // count bars from when this song started, so each song starts at its beginning
    if (mode !== music.lastMode) { music.lastMode = mode; music.songBar = 0; }
    if (mode === 'battle') { battleBar(t, music.songBar++); return; }
    if (mode === 'happy') { happyBar(t, music.songBar++); return; }
    const bar = music.songBar++;
    const s16 = sixteenth(mode), r = Math.random;
    if (mode === 'war') {
      for (let i = 0; i < 16; i++) {
        const tt = t + i * s16;
        if (i % 4 === 0 || i === 14) huehuetl(tt, i === 0 ? 1 : 0.75);
        teponaztli(tt, i % 3 === 0, i % 2 ? 0.18 : 0.32);
        rattle(tt, i % 2 ? 0.08 : 0.16, 0.05);
      }
      if (bar % 2 === 0) conch(t, ROOT - 12, s16 * 12, 0.22);
      return;
    }
    if (mode === 'night') {
      if (bar % 2 === 0) huehuetl(t, 0.4);
      for (const i of [0, 6, 10, 12]) if (r() < 0.75) teponaztli(t + i * s16, i === 6 || i === 12, 0.14);
      for (let i = 0; i < 16; i += 2) if (r() < 0.5) rattle(t + i * s16, 0.045, 0.12);
      if (bar % 4 === 0) drone(t, ROOT - 24, s16 * 64, 0.12);
      if (!music.motif || bar % 16 === 0) { music.motif = newMotif(true); music.phrase = 0; }
      if (bar % 4 === 1 && r() < 0.8) { playTune(t, mode, s16 * 1.2, true, 0.13); music.phrase++; }
      return;
    }
    // day
    const drumBeats = bar % 2 ? [0, 6, 8, 14] : [0, 8, 10];
    for (const i of drumBeats) huehuetl(t + i * s16, i === 0 ? 0.85 : 0.6);
    const logPattern = [[0, 0], [3, 1], [4, 0], [7, 1], [8, 0], [10, 1], [12, 1], [14, 0]];
    for (const [i, high] of logPattern) if (r() < 0.85) teponaztli(t + i * s16, high, 0.28);
    for (let i = 0; i < 16; i++) rattle(t + i * s16, i % 4 === 2 ? 0.12 : 0.04);
    if (bar % 16 === 0) conch(t, ROOT - 12, s16 * 14, 0.16);
    // the flute plays 8 bars, then rests 4 bars
    const spot = bar % 12;
    if (spot === 0) { music.motif = newMotif(false); music.phrase = 0; }
    if (spot >= 2 && spot < 10 && spot % 2 === 0) { playTune(t, mode, s16, false, 0.16); music.phrase++; }
  }

  music.tick = (until) => {
    while (music.nextBar < until) {
      const mode = music.song === 'battle' || music.song === 'happy' ? music.song : music.mode;
      scheduleBar(music.nextBar, mode);
      music.nextBar += sixteenth(mode) * 16;
      music.bar++;
    }
  };
  return music;
}

/* turn music on and off with the button. Browsers only allow sound after you click something. */
let soundChoice = 'day', musicOn = true, musicCtx = null, music = null;   // soundChoice: 'day', 'battle', 'happy' or 'off'
try {
  const saved = localStorage.getItem(SAVE_NAME + '_music');
  soundChoice = ['off', 'battle', 'happy'].includes(saved) ? saved : 'day';
} catch (e) {}
musicOn = soundChoice !== 'off';
function startMusic() {
  if (!musicOn) return;
  if (!musicCtx) {
    musicCtx = new (window.AudioContext || window.webkitAudioContext)();
    music = makeMusic(musicCtx, musicCtx.destination);
    music.song = soundChoice;
    setInterval(() => {
      if (!musicOn || document.hidden) return;
      music.mode = raid ? 'war' : isNight() ? 'night' : 'day';
      music.tick(musicCtx.currentTime + 0.4);
    }, 60);
  }
  musicCtx.resume();
  if (music.nextBar < musicCtx.currentTime) music.nextBar = musicCtx.currentTime + 0.1;
}
/* the sound menu: pick "The Day of an Aztec" or no sound */
function updateMusicButton() {
  document.getElementById('soundGlyph').src = glyph(musicOn ? 'drum' : 'drumOff');
  document.querySelectorAll('#soundMenu button').forEach(b => b.classList.toggle('chosen', b.dataset.sound === soundChoice));
}
function setSound(choice) {
  const changed = choice !== soundChoice;
  soundChoice = choice;
  musicOn = choice !== 'off';
  try { localStorage.setItem(SAVE_NAME + '_music', choice); } catch (err) {}
  if (musicOn) {
    startMusic();
    if (changed) { music.song = choice; music.nextBar = musicCtx.currentTime + 0.25; }   // switch songs right away
  } else if (musicCtx) musicCtx.suspend();
  updateMusicButton();
  document.getElementById('soundMenu').classList.remove('open');
}
document.getElementById('soundBtn').onclick = () => document.getElementById('soundMenu').classList.toggle('open');
document.querySelectorAll('#soundMenu button').forEach(b => b.onclick = () => setSound(b.dataset.sound));
document.addEventListener('click', e => {   // clicking anywhere else closes the menu
  if (!document.getElementById('soundWrap').contains(e.target)) document.getElementById('soundMenu').classList.remove('open');
});
document.addEventListener('pointerdown', startMusic, { once: true });
document.addEventListener('visibilitychange', () => {
  if (!musicCtx) return;
  if (document.hidden) musicCtx.suspend(); else if (musicOn) startMusic();
});
updateMusicButton();

/* ---------- START ---------- */
document.getElementById('sacrifice').onclick = sacrifice;
document.getElementById('stopPlacing').onclick = stopPlacing;
const confirmBox = document.getElementById('confirmBox');
document.getElementById('newGame').onclick = () => confirmBox.style.display = 'flex';
document.getElementById('noNew').onclick = () => confirmBox.style.display = 'none';
document.getElementById('yesNew').onclick = () => {
  confirmBox.style.display = 'none';
  stopPlacing();
  game = newGame();
  raid = null;
  walkers.length = 0;
  shownLand = 1;
  save(); drawShop(); drawEnemies();
  startTutorial();
};
fillGlyphs();
load();
shownLand = landSize();
fixFarms();
drawShop();
drawEnemies();
requestAnimationFrame(loop);
if (!game.tutorialDone) setTimeout(startTutorial, 300);   // first time playing? show the tutorial
</script>
